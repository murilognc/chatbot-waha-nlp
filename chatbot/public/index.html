<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Laboratório de Chatbots</title>
    <style>
      body {
        font-family: system-ui;
        background: #f1f5f9;
        color: #0f172a;
        max-width: 760px;
        margin: 50px auto;
        padding: 0 20px;
      }
      main {
        background: white;
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 4px 20px #0001;
      }
      input,
      button {
        font: inherit;
        padding: 12px;
        border-radius: 8px;
      }
      input {
        width: 70%;
        border: 1px solid #94a3b8;
      }
      button {
        background: #0f766e;
        color: white;
        border: 0;
        cursor: pointer;
      }
      pre {
        background: #e2e8f0;
        padding: 20px;
        border-radius: 8px;
        white-space: pre-wrap;
      }
      small {
        color: #475569;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Chatbot WhatsApp — Aula prática</h1>
      <p>Teste o processamento de intenções sem conectar o WhatsApp.</p>
      <form id="f">
        <input
          id="texto"
          placeholder="Ex.: Qual o preço do teclado?"
          required
        /><button>Enviar</button>
      </form>
      <h3>Resultado</h3>
      <pre id="saida">Aguardando mensagem...</pre>
      <small>Exemplos: oi, menu, estoque do mouse, pedido 1002, produtos</small>
    </main>
    <script>
      document.querySelector("#f").addEventListener("submit", async (e) => {
        e.preventDefault();
        const saida = document.querySelector("#saida");
        saida.textContent = "Processando...";
        try {
          const r = await fetch("/simular", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              texto: document.querySelector("#texto").value,
            }),
          });
          saida.textContent = JSON.stringify(await r.json(), null, 2);
        } catch (err) {
          saida.textContent = err.message;
        }
      });
    </script>
  </body>
</html>
